name: Debug 403 (temporary)
on: workflow_dispatch
permissions: {}
jobs:
  debug:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false
      - name: Call responses
        env:
          EP: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
        run: |
          TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)
          curl -sS -o body.txt -w 'status=%{http_code}\n' -X POST "$EP/openai/v1/responses" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"input":"say pong","max_output_tokens":200,"extra_body":null,"agent_reference":{"type":"agent_reference","name":"sdlc-release-notes"}}'
          cat body.txt | head -c 1500; echo
          echo '--- list agents'
          curl -sS -o body2.txt -w 'status=%{http_code}\n' "$EP/agents?api-version=v1" -H "Authorization: Bearer $TOKEN"
          head -c 600 body2.txt
