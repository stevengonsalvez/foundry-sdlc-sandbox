name: Agent review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel previous review for same PR; only latest diff matters.
concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions: {}

jobs:
  review:
    # Same-repo PRs only (no fork PRs get Azure access).
    # Allow: PRs authored by the repo owner, OR by github-actions[bot] on agent/issue-* branches
    # (so the demo chain issue -> draft PR -> review works).
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.pull_request.user.login == github.repository_owner ||
        (
          github.event.pull_request.user.login == 'github-actions[bot]' &&
          startsWith(github.event.pull_request.head.ref, 'agent/issue-')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: "false"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Collect diff (capped at 12 KB)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Three-dot diff: changes on HEAD relative to the merge base (avoids base drift).
          # Full diff to a file first: piping into head makes git die of SIGPIPE (141) under pipefail.
          git diff "${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/pr_diff_full.txt"
          head -c 12288 "$RUNNER_TEMP/pr_diff_full.txt" > "$RUNNER_TEMP/pr_diff.txt"
          echo "Diff size: $(wc -c < "$RUNNER_TEMP/pr_diff.txt") bytes"

      - name: Build prompt file
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYEOF'
          import os
          pr_title = os.environ.get("PR_TITLE", "")[:300]
          pr_number = os.environ.get("PR_NUMBER", "")
          with open(f"{os.environ['RUNNER_TEMP']}/pr_diff.txt", encoding="utf-8") as fh:
              diff = fh.read()
          prompt = f"PR #{pr_number}: {pr_title}\n\nDiff:\n```diff\n{diff}\n```"
          with open(f"{os.environ['RUNNER_TEMP']}/prompt.txt", "w", encoding="utf-8") as fh:
              fh.write(prompt)
          PYEOF

      - name: Invoke sdlc-review agent
        uses: ./.github/actions/call-agent
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
        with:
          agent: sdlc-review
          input-file: ${{ runner.temp }}/prompt.txt
          output-file: ${{ runner.temp }}/review_output.md
          max-output-tokens: "8000"

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Agent code review"
            echo ""
            cat "$RUNNER_TEMP/review_output.md"
            echo ""
            echo "> [!NOTE]"
            echo "> Generated by sdlc-review agent. Human review required before merge."
          } | gh pr comment "$PR_NUMBER" --body-file - --repo "$GITHUB_REPOSITORY"
