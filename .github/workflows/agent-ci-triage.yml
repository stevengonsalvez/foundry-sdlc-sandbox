name: Agent CI triage

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Dedupe by head SHA so one failure = one triage, not one per run-id.
concurrency:
  group: agent-ci-triage-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions: {}

jobs:
  ci-triage:
    # Only failed runs, same-repo (no forks), owner or github-actions[bot] actor.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.actor.login == github.repository_owner ||
        github.event.workflow_run.actor.login == 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write

    steps:
      # Look up PR number from the event payload BEFORE spending any Azure tokens.
      # github.event.workflow_run.pull_requests[0].number is populated for same-repo PRs.
      - name: Find associated PR number
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Primary: event payload (populated for same-repo pull_request-triggered runs).
          PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")

          # Fallback: API lookup.
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '.[0].number // empty' 2>/dev/null || true)
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR for SHA $HEAD_SHA; skipping agent call."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.find-pr.outputs.skip != 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.find-pr.outputs.skip != 'true'
        with:
          persist-credentials: "false"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.find-pr.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install sdlc_agents dependencies
        if: steps.find-pr.outputs.skip != 'true'
        run: pip install "azure-ai-projects==2.8.0" "azure-identity==1.23.0"

      - name: Fetch failed job logs (keep the last 4 MiB; failures are at the end)
        id: logs
        if: steps.find-pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log-failed --repo "$GITHUB_REPOSITORY" 2>/dev/null \
            | tail -c 4194304 > "$RUNNER_TEMP/ci_logs.txt" || true
          echo "Log size: $(wc -c < "$RUNNER_TEMP/ci_logs.txt") bytes"

          # Skip agent if logs are empty (run had no loggable failure output).
          if [ ! -s "$RUNNER_TEMP/ci_logs.txt" ]; then
            echo "Empty logs; nothing to triage."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build prompt file
        if: steps.find-pr.outputs.skip != 'true' && steps.logs.outputs.skip != 'true'
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PYEOF'
          import os
          workflow_name = os.environ.get("WORKFLOW_NAME", "")[:100]
          head_branch = os.environ.get("HEAD_BRANCH", "")[:100]
          head_sha = os.environ.get("HEAD_SHA", "")[:40]
          with open(f"{os.environ['RUNNER_TEMP']}/ci_logs.txt", encoding="utf-8", errors="replace") as fh:
              logs = fh.read()
          prompt = (
              f"Workflow '{workflow_name}' failed on branch '{head_branch}' "
              f"(sha {head_sha}).\n\nFailed job logs (tail; sdlc_agents.call keeps head 2k + tail 58k):\n```\n{logs}\n```"
          )
          with open(f"{os.environ['RUNNER_TEMP']}/prompt.txt", "w", encoding="utf-8") as fh:
              fh.write(prompt)
          PYEOF

      - name: Invoke sdlc-ci-triage agent
        if: steps.find-pr.outputs.skip != 'true' && steps.logs.outputs.skip != 'true'
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          PYTHONPATH: tools
        run: |
          python -m sdlc_agents.call \
            --agent sdlc-ci-triage \
            --input-file "$RUNNER_TEMP/prompt.txt" \
            --max-output-tokens 8000 \
            > "$RUNNER_TEMP/ci_triage_output.md"

      - name: Post comment on PR
        if: steps.find-pr.outputs.skip != 'true' && steps.logs.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
        run: |
          {
            echo "## Agent CI triage"
            echo ""
            cat "$RUNNER_TEMP/ci_triage_output.md"
            echo ""
            echo "> [!NOTE]"
            echo "> Generated by sdlc-ci-triage agent. Verify before acting."
          } | gh pr comment "$PR_NUMBER" --body-file - --repo "$GITHUB_REPOSITORY"
